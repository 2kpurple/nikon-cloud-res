name: Update Creators Data

on:
  schedule:
    # 每天 UTC 10:00 (北京时间 18:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-creators:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scrape-creators.js

      - name: Reject mojibake output
        run: |
          node -e "
            const fs = require('fs');
            const files = [];
            (function walk(p) {
              if (fs.statSync(p).isDirectory()) { fs.readdirSync(p).forEach(f => walk(p + '/' + f)); return; }
              if (p.endsWith('.json')) files.push(p);
            })('assets');
            let bad = files.filter(f => fs.readFileSync(f, 'utf8').includes('\uFFFD'));
            if (bad.length) { console.error('ERROR: U+FFFD found in: ' + bad.join(', ')); process.exit(1); }
            console.log(files.length + ' files checked, no mojibake.');
          "

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- assets/ && [ -z "$(git ls-files --others --exclude-standard assets/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data updated!"
          fi

      - name: Commit and create release
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="creators-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/
          git commit -m "chore: update creators data (${DATE})"
          git push

          SUMMARY=$(node -e "
            const fs = require('fs');
            const lines = [];
            for (const f of fs.readdirSync('assets').filter(f => f.endsWith('.json')).sort()) {
              const d = JSON.parse(fs.readFileSync('assets/' + f, 'utf8'));
              if (Array.isArray(d)) {
                lines.push('- ' + f + ': ' + d.length + ' creators, ' + d.reduce((n, c) => n + c.recipes.length, 0) + ' recipes');
              } else if (d.recipes) {
                lines.push('- ' + f + ': book \"' + (d.label || d.bookId) + '\", ' + d.recipes.length + ' recipes');
              }
            }
            const manifest = JSON.parse(fs.readFileSync('assets/img/manifest.json', 'utf8'));
            const byHash = new Map();
            for (const v of Object.values(manifest)) if (v.hash) byHash.set(v.hash, v.bytes);
            let bytes = 0; for (const b of byHash.values()) bytes += b;
            lines.push('- images: ' + byHash.size + ' unique, ' + (bytes / 1024 / 1024).toFixed(1) + 'MB');
            const details = fs.readdirSync('assets/details', { recursive: true }).filter(f => f.endsWith('.json'));
            lines.push('- details: ' + details.length + ' snapshots');
            console.log(lines.join('\n'));
          ")

          gh release create "$TAG" \
            --title "Creators Data Update ${DATE}" \
            --notes "$SUMMARY" \
            --target main \
            assets/creators_*.json assets/book_*.json
