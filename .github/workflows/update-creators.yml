name: Update Creators Data

on:
  schedule:
    # 每天 UTC 10:00 (北京时间 18:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-creators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scrape-creators.js

      - name: Reject mojibake output
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('assets').filter(f => /^creators_.*\.json$/.test(f));
            let bad = files.filter(f => fs.readFileSync('assets/' + f, 'utf8').includes('\uFFFD'));
            if (bad.length) { console.error('ERROR: U+FFFD found in: ' + bad.join(', ')); process.exit(1); }
            console.log(files.length + ' files checked, no mojibake.');
          "

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- 'assets/creators_*.json'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data updated!"
          fi

      - name: Commit and create release
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="creators-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/creators_*.json
          git commit -m "chore: update creators data (${DATE})"
          git push

          SUMMARY=$(node -e "
            const fs = require('fs');
            const lines = fs.readdirSync('assets')
              .filter(f => /^creators_.*\.json$/.test(f))
              .map(f => {
                const d = JSON.parse(fs.readFileSync('assets/' + f, 'utf8'));
                return '- ' + f + ': ' + d.length + ' creators, ' + d.reduce((n, c) => n + c.recipes.length, 0) + ' recipes';
              });
            console.log(lines.join('\n'));
          ")

          gh release create "$TAG" \
            --title "Creators Data Update ${DATE}" \
            --notes "$SUMMARY" \
            --target main \
            assets/creators_*.json
